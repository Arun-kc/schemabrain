# Publishes SchemaBrain to TestPyPI or PyPI via Trusted Publishers (OIDC).
#
# No long-lived API tokens. PyPI/TestPyPI verify the workflow's OIDC token
# against a pending-or-existing Trusted Publisher configured on each index.
#
# Manual-dispatch only for v0.1.0a1: every publish requires going to the
# GitHub Actions UI and explicitly picking `testpypi` or `pypi`. No tag
# push auto-triggers a release. Trade-off: more clicks per release. Why:
#
#   1. Free-plan private repos cannot set Required-Reviewer protection on
#      GitHub Environments, so a tag-triggered chain has no human gate
#      between TestPyPI and PyPI.
#   2. First publishes are the highest-risk moment — once a version like
#      `0.1.0a1` is on PyPI it is immutable forever. Manual dispatch makes
#      every publish an intentional act.
#
# Once the package is established and the pipeline is proven, this can
# convert to a tag-triggered or release-triggered design.

name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      version:
        description: "Version tag for the Docker image (e.g. 0.3.0). Required when target=pypi; ignored otherwise."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    outputs:
      # The version the post-publish `verify` job pins its install to. Parsed
      # from the wheel filename (the canonical record of what this run builds
      # and uploads) rather than re-reading pyproject, so verify can never test
      # a different version than the one actually shipped.
      version: ${{ steps.wheelver.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      # The dashboard's Next.js static export lives under
      # `schemabrain/dashboard/static/`, which is gitignored — built at
      # release time, never committed. The wheel target's `artifacts`
      # glob (pyproject.toml) bundles whatever is on disk at build time,
      # so this export MUST run before `uv build` or the wheel ships an
      # empty dashboard (the 0.4.0 break). Mirrors the ci.yml dashboard
      # build, minus the paths-filter guards — a release always rebuilds
      # the export unconditionally.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build dashboard static export
        working-directory: web
        run: pnpm run export

      # `uv build --wheel`, NOT bare `uv build`. Default `uv build` builds
      # the wheel FROM the sdist, and the sdist phase walks the VCS tree
      # and honours .gitignore — which strips the freshly-built (gitignored)
      # static export, producing an empty-dashboard wheel even though the
      # files exist on disk. `--wheel` builds directly from the working
      # tree and honours the wheel target's `artifacts` directive. PyPI
      # installs resolve the py3-none-any wheel, so a source dist is not
      # required for launch.
      - name: Build wheel
        run: uv build --wheel

      # Fail the release loudly if the wheel shipped without the dashboard
      # export. The `artifacts` glob does NOT force inclusion when files
      # are absent — it only protects against an exclude shadowing them —
      # so an empty/sentinel-only ship would otherwise pass silently (this
      # is exactly how 0.4.0 went out broken).
      - name: Verify wheel bundles the dashboard static export
        run: |
          set -euo pipefail
          # Exactly one wheel must exist (single-package build). Guard
          # against a stray/second wheel silently shadowing the check.
          wheel_count=$(ls -1 dist/*.whl 2>/dev/null | wc -l | tr -d ' ')
          [ "$wheel_count" = "1" ] \
            || { echo "BLOCKED: expected exactly one wheel in dist/, found $wheel_count"; exit 1; }
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"
          listing=$(unzip -l "$wheel")
          # index.html is the root redirect stub (forwards `/` → `/overview`,
          # the dashboard home — the marketing landing now ships separately in
          # site/). Its presence + the _next bundle prove the export ran at all;
          # the real "home loads" guard is the overview.html route check below.
          echo "$listing" | grep -q "schemabrain/dashboard/static/index.html" \
            || { echo "BLOCKED: wheel ships no dashboard/static/index.html (empty dashboard)"; exit 1; }
          next_count=$(echo "$listing" | grep -c "/dashboard/static/_next/" || true)
          [ "$next_count" -gt 0 ] \
            || { echo "BLOCKED: wheel ships no dashboard/static/_next/* assets"; exit 1; }
          # Per-route sentinels — a PARTIAL export (index.html present but a
          # surface route missing) would otherwise pass the index-only check.
          # Every built surface (nav.ts `built: true`) must export its route.
          for route in overview graph entities dict pii audit refusals policy drift; do
            echo "$listing" | grep -q "schemabrain/dashboard/static/$route.html" \
              || { echo "BLOCKED: wheel missing dashboard surface route '$route.html' (partial export)"; exit 1; }
          done
          # CSP hash manifest (issue #185) — the sidecar reads this to build a
          # hash-pinned script-src. If it is MISSING from the wheel, the sidecar
          # silently falls back to strict `script-src 'self'`, which refuses
          # every inline bootstrap script and breaks the dashboard at runtime.
          # `pnpm run export` writes it via scripts/inject-csp-hashes.mjs.
          echo "$listing" | grep -q "schemabrain/dashboard/static/csp-script-hashes.json" \
            || { echo "BLOCKED: wheel missing csp-script-hashes.json (CSP script-src would break the dashboard at runtime)"; exit 1; }
          echo "OK: dashboard bundled — index.html + overview/graph/entities/dict/pii/audit/refusals/policy/drift routes + csp-script-hashes.json + $next_count _next assets"

      - name: Extract published version from the wheel filename
        id: wheelver
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          # schemabrain-0.6.0-py3-none-any.whl -> 0.6.0. The first hyphen-
          # delimited field after the package name is the version; pin verify
          # to exactly this so it can never test a stale or mismatched build.
          version=$(basename "$wheel" | sed -E 's/^schemabrain-([^-]+)-.*/\1/')
          [ -n "$version" ] && [ "$version" != "$(basename "$wheel")" ] \
            || { echo "BLOCKED: could not parse version from wheel '$wheel'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Published version parsed from wheel: $version"

      - name: Show built artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Environment binding is what scopes the OIDC token claim that
      # PyPI/TestPyPI verify against their Trusted Publisher config.
      # The environment names must match what was registered on each
      # index: `testpypi` on test.pypi.org, `pypi` on pypi.org.
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/schemabrain' || 'https://test.pypi.org/p/schemabrain' }}
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    # Post-publish smoke: prove the *live, installed* package works, not just
    # that the upload returned 200. The build job already verifies the wheel's
    # contents pre-upload; this job is the missing half — install from the real
    # index into a clean venv, assert the version, and boot the engine + the
    # dashboard sidecar. Runs for BOTH targets so a TestPyPI dress-rehearsal
    # exercises the exact same gate the production publish does. A failure here
    # blocks the Docker image build below.
    name: Verify published package (${{ inputs.target }}) installs + boots
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Wait for the index, install from it, assert version, smoke-boot
        run: |
          set -euo pipefail

          if [ "$TARGET" = "pypi" ]; then
            json_host="https://pypi.org/pypi"
            # Real index only — schemabrain + all runtime deps live here.
            index_args=""
          else
            json_host="https://test.pypi.org/pypi"
            # schemabrain comes from TestPyPI; its runtime deps (fastapi,
            # uvicorn, sse-starlette, ...) are NOT mirrored there, so resolve
            # them from real PyPI. The exact-version pin below guarantees pip
            # still takes schemabrain itself from TestPyPI (the only index that
            # has this just-published version pre-production).
            index_args="--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/"
          fi

          # 1. Wait out index/CDN propagation. Right after upload the JSON API
          #    + Fastly can lag by tens of seconds; without this an immediate
          #    install 404s and the gate looks broken when it is not. ~3 min cap.
          echo "Waiting for $TARGET to serve schemabrain==$VERSION ..."
          for attempt in $(seq 1 12); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' \
              "$json_host/schemabrain/$VERSION/json" || true)
            if [ "$code" = "200" ]; then
              echo "  index serving $VERSION (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "BLOCKED: schemabrain==$VERSION never appeared on $TARGET after ~3m (last HTTP $code)"
              exit 1
            fi
            echo "  not yet (HTTP $code) — retry in 15s [$attempt/12]"
            sleep 15
          done

          # 2. Clean-install from the live index. Fresh venv + --no-cache-dir so
          #    a cached older wheel can never satisfy the pin.
          python -m venv /tmp/verifyenv
          # shellcheck disable=SC1091
          . /tmp/verifyenv/bin/activate
          python -m pip install --quiet --upgrade pip
          # shellcheck disable=SC2086
          pip install --no-cache-dir $index_args "schemabrain[ui]==$VERSION"

          # 3. The installed package must report exactly the published version,
          #    via both the CLI flag and importlib.metadata.
          cli_ver=$(schemabrain --version | awk '{print $NF}')
          meta_ver=$(python -c "import importlib.metadata as m; print(m.version('schemabrain'))")
          echo "CLI=$cli_ver  metadata=$meta_ver  expected=$VERSION"
          [ "$cli_ver" = "$VERSION" ]  || { echo "BLOCKED: schemabrain --version=$cli_ver != $VERSION"; exit 1; }
          [ "$meta_ver" = "$VERSION" ] || { echo "BLOCKED: importlib.metadata=$meta_ver != $VERSION"; exit 1; }

          # 4. Engine smoke — builds the offline showcase store and runs the
          #    firewall showcase end to end. Proves the classifier/firewall/
          #    engine actually import and run from the installed wheel (pure
          #    Python, no Docker, no API key). Also seeds the store the sidecar
          #    reads next. </dev/null + timeout guard against any stray prompt.
          timeout 180 schemabrain demo --showcase --store-path /tmp/sb.db --no-open < /dev/null

          # 5. Sidecar smoke — boot the read-only dashboard against that store
          #    and confirm it actually serves: liveness, one data route (proves
          #    store resolution + the graph projection), and the static export.
          schemabrain dashboard --store-path /tmp/sb.db --port 7878 --no-open < /dev/null \
            > /tmp/sidecar.log 2>&1 &
          sidecar_pid=$!
          trap 'kill "$sidecar_pid" 2>/dev/null || true' EXIT

          base="http://127.0.0.1:7878"
          for attempt in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$base/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "  sidecar up (attempt $attempt)"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "BLOCKED: /api/health never returned 200 (last HTTP $code)"
              echo "----- sidecar log -----"; cat /tmp/sidecar.log || true
              exit 1
            fi
            sleep 1
          done

          for route in /api/graph /overview; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$base$route" || true)
            [ "$code" = "200" ] \
              || { echo "BLOCKED: $route returned HTTP $code"; echo "----- sidecar log -----"; cat /tmp/sidecar.log || true; exit 1; }
            echo "  $route -> 200"
          done

          echo "OK: schemabrain==$VERSION installs from $TARGET, version matches, demo runs, sidecar serves /api/health + /api/graph + /overview"

  docker:
    name: Build + push Docker (linux/amd64 + linux/arm64)
    # Only runs on production publishes (PyPI). TestPyPI runs skip this
    # so we are not minting container images for unstable releases.
    if: inputs.target == 'pypi'
    # Gate on `verify`, not just `publish`: if the published wheel fails to
    # install or boot, do not mint container images for it.
    needs: [publish, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialise concurrent dispatches so two parallel publishes
    # (e.g. 0.3.1 and 0.3.2 dispatched seconds apart) cannot race on
    # the floating `:latest` and `:MAJOR.MINOR` tags. `cancel-in-progress: false`
    # keeps both releases — the later dispatch waits its turn.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    env:
      # Validated below before reaching any shell that interpolates
      # it. Routed through env to avoid GitHub Actions expression
      # syntax landing inside a `run:` shell string.
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::version input is required when target=pypi"
            exit 1
          fi
          # Strict semver-ish check: MAJOR.MINOR.PATCH with optional
          # pre-release suffix (e.g. 0.3.0a1; trailing digit required
          # so a bare '0.3.0a' is rejected). Rejects empty, leading
          # 'v', and obviously-wrong shapes.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([a-z]+[0-9]+)?$'; then
            echo "::error::version '$VERSION' does not look like MAJOR.MINOR.PATCH[suffix]"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Compute MAJOR.MINOR floating tag + lowercase owner
        id: tags
        run: |
          MAJOR_MINOR=$(printf '%s' "$VERSION" | cut -d. -f1-2)
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"
          # ghcr.io rejects uppercase characters in image references —
          # `${{ github.repository_owner }}` is the GitHub username
          # verbatim, which preserves case (Arun-kc, not arun-kc). The
          # 2026-05-20 publish workflow failed at this exact step with
          # "name unknown: name must be lowercase". Compute a
          # downcased owner here so the Docker push reference is
          # always valid regardless of how the user typed their
          # GitHub username.
          OWNER_LC=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Three tags: pinned patch, floating minor, floating latest.
          # `VERSION` is the env var already validated by the
          # validate step above; using it here keeps the same source
          # of truth.
          tags: |
            ghcr.io/${{ steps.tags.outputs.owner_lc }}/schemabrain:${{ env.VERSION }}
            ghcr.io/${{ steps.tags.outputs.owner_lc }}/schemabrain:${{ steps.tags.outputs.major_minor }}
            ghcr.io/${{ steps.tags.outputs.owner_lc }}/schemabrain:latest
          # Build cache via GitHub Actions cache backend. Cuts ARM64
          # cold builds substantially after the first push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

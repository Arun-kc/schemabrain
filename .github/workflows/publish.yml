# Publishes Schema Brain to TestPyPI or PyPI via Trusted Publishers (OIDC).
#
# No long-lived API tokens. PyPI/TestPyPI verify the workflow's OIDC token
# against a pending-or-existing Trusted Publisher configured on each index.
#
# Manual-dispatch only for v0.1.0a1: every publish requires going to the
# GitHub Actions UI and explicitly picking `testpypi` or `pypi`. No tag
# push auto-triggers a release. Trade-off: more clicks per release. Why:
#
#   1. Free-plan private repos cannot set Required-Reviewer protection on
#      GitHub Environments, so a tag-triggered chain has no human gate
#      between TestPyPI and PyPI.
#   2. First publishes are the highest-risk moment — once a version like
#      `0.1.0a1` is on PyPI it is immutable forever. Manual dispatch makes
#      every publish an intentional act.
#
# Once the package is established and the pipeline is proven, this can
# convert to a tag-triggered or release-triggered design.

name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
      version:
        description: "Version tag for the Docker image (e.g. 0.3.0). Required when target=pypi; ignored otherwise."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Build distributions
        run: uv build

      - name: Show built artifacts
        run: ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      # Environment binding is what scopes the OIDC token claim that
      # PyPI/TestPyPI verify against their Trusted Publisher config.
      # The environment names must match what was registered on each
      # index: `testpypi` on test.pypi.org, `pypi` on pypi.org.
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/p/schemabrain' || 'https://test.pypi.org/p/schemabrain' }}
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Build + push Docker (linux/amd64 + linux/arm64)
    # Only runs on production publishes (PyPI). TestPyPI runs skip this
    # so we are not minting container images for unstable releases.
    if: inputs.target == 'pypi'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialise concurrent dispatches so two parallel publishes
    # (e.g. 0.3.1 and 0.3.2 dispatched seconds apart) cannot race on
    # the floating `:latest` and `:MAJOR.MINOR` tags. `cancel-in-progress: false`
    # keeps both releases — the later dispatch waits its turn.
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    env:
      # Validated below before reaching any shell that interpolates
      # it. Routed through env to avoid GitHub Actions expression
      # syntax landing inside a `run:` shell string.
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version input
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::version input is required when target=pypi"
            exit 1
          fi
          # Strict semver-ish check: MAJOR.MINOR.PATCH with optional
          # pre-release suffix (e.g. 0.3.0a1; trailing digit required
          # so a bare '0.3.0a' is rejected). Rejects empty, leading
          # 'v', and obviously-wrong shapes.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([a-z]+[0-9]+)?$'; then
            echo "::error::version '$VERSION' does not look like MAJOR.MINOR.PATCH[suffix]"
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Compute MAJOR.MINOR floating tag
        id: tags
        run: |
          MAJOR_MINOR=$(printf '%s' "$VERSION" | cut -d. -f1-2)
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Three tags: pinned patch, floating minor, floating latest.
          # `VERSION` is the env var already validated by the
          # validate step above; using it here keeps the same source
          # of truth.
          tags: |
            ghcr.io/${{ github.repository_owner }}/schemabrain:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/schemabrain:${{ steps.tags.outputs.major_minor }}
            ghcr.io/${{ github.repository_owner }}/schemabrain:latest
          # Build cache via GitHub Actions cache backend. Cuts ARM64
          # cold builds substantially after the first push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

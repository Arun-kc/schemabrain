<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" role="img" aria-label="schemabrain architecture: agent talks to schemabrain over MCP stdio; schemabrain emits parameterized SQL to Postgres; the schemabrain boundary is the trust boundary.">
  <rect width="900" height="560" fill="#0C0C0C"></rect>

  
  <rect x="280" y="60" width="340" height="460" fill="#3DCD8B" fill-opacity="0.04"></rect>

  
  
  <g transform="translate(276 78) scale(0.5)">
    <defs>
      <clipPath id="cb-d"><path d="M22 12 C 22 8, 30 6, 32 10 C 36 6, 44 8, 44 14 C 50 12, 56 18, 52 24 C 58 28, 56 36, 50 38 C 54 44, 48 52, 40 50 C 38 56, 28 56, 26 52 C 18 54, 12 48, 14 42 C 8 40, 6 32, 12 30 C 8 24, 12 16, 18 18 C 18 14, 20 12, 22 12 Z"></path></clipPath>
    </defs>
    <g clip-path="url(#cb-d)">
      <rect x="32" y="0" width="32" height="64" fill="#3DCD8B"></rect>
    </g>
    <path d="M22 12 C 22 8, 30 6, 32 10 C 36 6, 44 8, 44 14 C 50 12, 56 18, 52 24 C 58 28, 56 36, 50 38 C 54 44, 48 52, 40 50 C 38 56, 28 56, 26 52 C 18 54, 12 48, 14 42 C 8 40, 6 32, 12 30 C 8 24, 12 16, 18 18 C 18 14, 20 12, 22 12 Z" stroke="#FAFAF7" stroke-width="2.2" stroke-linejoin="round" fill="none"></path>

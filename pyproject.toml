[project]
name = "schemabrain"
version = "0.0.0"
description = "An MCP server that gives AI agents deep semantic understanding of any production database."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Arun K C" },
]
keywords = ["mcp", "database", "semantic", "ai-agents", "postgres", "schema"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.5,<3.0",
    "structlog>=24.0,<25.0",
    "anthropic>=0.40,<1.0",
    "fastembed>=0.4,<1.0",
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
    "testcontainers[postgres]>=4.0,<5.0",
]

[project.urls]
Homepage = "https://github.com/Arun-kc/schemabrain"
Issues = "https://github.com/Arun-kc/schemabrain/issues"

[project.scripts]
schemabrain = "schemabrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemabrain"]
# Bundled data files inside the package directory. Hatchling's wheel
# default would include these (no `exclude` shadows them today), but
# pinning them explicitly via `artifacts` makes the contract durable —
# a future contributor can't silently drop them by adding an `exclude`
# pattern. Both files are referenced by `DEFAULT_GOLDEN_PATH` and the
# eval CLI quickstart respectively; losing either breaks the
# "pip install + 3 commands works" Preview-DoD line.
artifacts = [
    "schemabrain/eval/golden_sets/*.json",
    "schemabrain/eval/fixtures/*.sql",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker (testcontainers). Skip with -m 'not integration'.",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:testcontainers.*",
]

[tool.coverage.run]
source = ["schemabrain"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]

[project]
name = "schemabrain"
version = "0.4.0"
description = "The SQL firewall between AI agents and your production database."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Arun K C" },
]
keywords = ["mcp", "database", "semantic", "ai-agents", "postgres", "schema"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.5,<3.0",
    "structlog>=24.0,<26.0",
    "anthropic>=0.40,<1.0",
    "fastembed>=0.4,<1.0",
    "mcp>=1.0,<2.0",
    "rich>=13.0,<16.0",
    # NumPy is the engine behind `Store.search_embeddings_topk` (bulk
    # SELECT + float32 matmul + cosine). It arrives transitively via
    # fastembed too, but pin it as a direct dep so the contract is
    # durable: a future fastembed major can't silently drop it without
    # us catching the regression.
    "numpy>=1.26,<3.0",
    # sqlglot is the SQL parser behind query log mining. v0.5 uses it
    # to extract the set of tables a `pg_stat_statements` row touches
    # and to filter DDL/transaction-control statements out of the
    # example_queries write set. Pinned at the 25.x major; sqlglot
    # bumps the parser semantics across majors, so widening the range
    # is a deliberate review.
    "sqlglot>=25.0,<31.0",
    # PyYAML powers the entity YAML grammar parser
    # (`schemabrain entities apply <yaml-path>` and the in-process
    # loader behind it). It also arrives transitively via fastembed's
    # dep chain, but pinning it as a direct runtime dep makes the
    # contract durable: a future upstream drop can't silently break
    # the entity loader. Same pin previously held in dev-deps for
    # `tests/test_dependabot_config.py`; now lifted to runtime.
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Optional OpenTelemetry span emission. Activated when ALL three hold:
# (1) this extra is installed, (2) `OTEL_EXPORTER_OTLP_ENDPOINT` is
# set, (3) the operator runs `schemabrain serve`. Without the extra,
# `pip install schemabrain` works identically — `init_tracer_from_env`
# returns None and `@instrument` skips span emission. Spans flow over
# OTLP/HTTP to any OTel-compatible backend: Langfuse, Phoenix,
# OpenLIT, otel-tui. See `docs/observability.md` for setup recipes.
otel = [
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "testcontainers[postgres]>=4.0,<5.0",
    # `pip-audit` runs in the `security` CI job to fail any PR that
    # introduces a known-CVE dep. Pinning here (rather than uvx) lets
    # Dependabot manage upgrades and reproducibility lives in uv.lock.
    "pip-audit>=2.7,<3.0",
    # `bandit` runs in the `security` CI job for Python SAST. Same
    # pinning rationale as pip-audit: Dependabot-managed, uv.lock-pinned.
    "bandit>=1.7,<2.0",
    # `pytest-benchmark` powers the retrieval p95 gate (Phase A Commit 4).
    # Marked `slow` so the default `pytest` run skips it; the `slow`
    # CI job (or `pytest -m slow` locally) runs it and gates the
    # `find_relevant_tables` < 100ms-at-10k-cols Charter target.
    "pytest-benchmark>=4.0,<6.0",
    # Hypothesis powers the property-based tests on the metric
    # compiler (Q16 in `project_v1_quality_plan.md`) — required because
    # the compiler is a v2-substrate seam where the single-statement /
    # parameterisation / grain-check invariants must hold across the
    # whole input space, not just hand-picked examples.
    "hypothesis>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/Arun-kc/schemabrain"
Issues = "https://github.com/Arun-kc/schemabrain/issues"

[project.scripts]
schemabrain = "schemabrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Belt-and-suspenders against future stray venvs / scratch artifacts
# breaking the publish pipeline. `.gitignore` already excludes these,
# but hatchling's sdist build walks the working tree directly rather
# than asking git — so an uncommitted `.venv-foo/` next to `pyproject`
# would otherwise get packed and choke on absolute symlinks to a
# Python interpreter. The list mirrors `.gitignore`'s top-level
# directory exclusions; extend it if a new top-level scratch dir
# emerges.
exclude = [
    ".venv*",
    ".benchmarks",
    ".hypothesis",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".review",
    ".claude",
    "dist",
    "build",
    "htmlcov",
    "schemabrain-*.db",
    "schemabrain.db",
    "schemabrain.db-journal",
    "docs/internal",
]

[tool.hatch.build.targets.wheel]
packages = ["schemabrain"]
# Bundled data files inside the package directory. Hatchling's wheel
# default would include these (no `exclude` shadows them today), but
# pinning them explicitly via `artifacts` makes the contract durable —
# a future contributor can't silently drop them by adding an `exclude`
# pattern. Both files are referenced by `DEFAULT_GOLDEN_PATH` and the
# eval CLI quickstart respectively; losing either breaks the
# "pip install + 3 commands works" Preview-DoD line.
artifacts = [
    "schemabrain/eval/golden_sets/*.json",
    "schemabrain/eval/fixtures/*.sql",
    "schemabrain/eval/fixtures/entities/**/*.yaml",
    "schemabrain/imports/fixtures/*.json",
    "schemabrain/joins/fixtures/**/*.yaml",
    "schemabrain/metrics/fixtures/**/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
# Default `pytest` invocation skips `slow` tests (currently the
# pytest-benchmark perf gate — Phase A Commit 4). Local devs and CI's
# default-PR job stay fast; the dedicated `slow` CI job and on-demand
# runs explicitly pass `-m slow` to exercise the perf gate. Integration
# tests are NOT excluded by default — they run in the regular CI suite
# alongside Docker — but can be skipped locally with `-m "not integration"`.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker (testcontainers). Skip with -m 'not integration'.",
    "slow: long-running tests (e.g. pytest-benchmark perf gates). Skipped by default via `addopts`; run explicitly with `pytest -m slow`.",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::DeprecationWarning:testcontainers.*",
    # OpenTelemetry's internal `_importlib_metadata.py` shim still calls
    # the deprecated `EntryPoints.values()` API on Python 3.10+ (see
    # `opentelemetry/util/_importlib_metadata.py:32`). The deprecation
    # is in a third-party library, not in code we control, and will
    # resolve when upstream OTel updates its shim. Suppress here so
    # the warning doesn't tip the strict-warnings filter into a test
    # collection failure on every OTel SDK ≥1.42 bump.
    "ignore::DeprecationWarning:opentelemetry.*",
]

[tool.coverage.run]
source = ["schemabrain"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
    # `def name(...) -> T: ...` — Protocol method declarations.
    # The body is structurally unreachable (Protocols aren't
    # instantiated); excluding the line keeps coverage honest.
    "^\\s*def\\s.*:\\s*\\.\\.\\.\\s*$",
]

[tool.bandit]
# Scan only the runtime package — tests intentionally use `assert`
# (B101) and binding stubs against fake URLs that look like SQLi to
# bandit. Scope keeps the signal high.
exclude_dirs = ["tests", "scripts", ".venv", "build", "dist"]
# Per-line `# nosec B608` comments justify the only deliberate
# exceptions today (identifier-only f-string SQL assembled from
# SQLAlchemy `IdentifierPreparer.quote()` output — no user input).
# See `schemabrain/profiler/postgres.py:_fetch_aggregates` /
# `_fetch_samples` for the in-source justification.

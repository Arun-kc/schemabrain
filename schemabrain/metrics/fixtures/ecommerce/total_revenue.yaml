# ONE example metric definition for the bundled SchemaBrain
# ecommerce demo. SchemaBrain is a generic semantic layer; this is
# a starter pack, NOT a template every user should adopt verbatim.
#
# To apply:
#   schemabrain metrics apply schemabrain/metrics/fixtures/ecommerce/ \
#     --source $DATABASE_URL --store-path ./schemabrain.db
#
# Requires the matching entity + canonical-join definitions to be
# applied first (see schemabrain/entities/fixtures/ + schemabrain/
# joins/fixtures/).

version: 1
name: total_revenue
description: Sum of order totals (cents). One row per requested grain.
entity: order
measure:
  agg: sum
  column: total_cents
time_dimension: order.placed_at
time_grains: [day, week, month]
